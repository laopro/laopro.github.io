<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="laopro">
  <title>laopro</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    a {
      font-size: clamp(3rem, 12vw, 7rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      color: inherit;
      text-decoration: none;
      transition: opacity .2s ease;
    }
    a:hover { opacity: .6; }
    a:focus-visible { outline: 2px solid #f5f5f5; outline-offset: 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <a href="https://github.com/laopro">laopro</a>
</body>
</html>
